<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Controle Financeiro</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1220;
  display: flex;
  justify-content: center;
  padding: 30px;
}

.container {
  background: #ffffff;
  width: 450px;
  border-radius: 14px;
  padding: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #111827;
}

label {
  font-size: 12px;
  color: #555;
  margin-top: 12px;
  display: block;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 14px;
  outline: none;
}

input:focus, select:focus {
  border-color: #2563eb;
}

/* remove setas do number */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}
</style>
</head>

<body>

<div class="container">

<h2>Controle Financeiro</h2>

<label>Data</label>
<input type="date" id="data">

<label>Tipo</label>
<select id="tipo" onchange="trocarTipo()">
  <option value="">Selecione</option>
  <option value="Despesa">Despesa</option>
  <option value="Receita">Receita</option>
</select>

<label>Categoria (Despesa)</label>
<select id="categoriaDespesa">
  <option>Alimentação</option>
  <option>Transporte</option>
  <option>Moradia</option>
</select>

<label>Categoria (Receita)</label>
<select id="categoriaReceita" style="display:none;">
  <option>Salário</option>
  <option>Freelance</option>
  <option>Investimento</option>
</select>

<label>Descrição</label>
<input type="text" id="descricao">

<label>Parcelas</label>
<input type="number" id="parcelas" min="1" value="1">

<label>Valor</label>
<input type="text" id="valor" placeholder="0,00">

<button onclick="salvar()">Salvar</button>

</div>

<script>

const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbyEjKYND3VbIFUC3w_ApiI2YfCR1_uK6Z4atjDUZL6p-Cw6UabHTuwfM5J4CzQUb-1cZw/exec";

// data padrão hoje
document.getElementById("data").value = new Date().toISOString().split("T")[0];

function trocarTipo() {
  const tipo = document.getElementById("tipo").value;

  document.getElementById("categoriaDespesa").style.display =
    tipo === "Despesa" ? "block" : "none";

  document.getElementById("categoriaReceita").style.display =
    tipo === "Receita" ? "block" : "none";
}

// valida valor (inteiro ou 2 casas decimais com vírgula)
function validarValor(valor) {
  return /^\\d+(,\\d{1,2})?$/.test(valor);
}

async function salvar() {

  const tipo = document.getElementById("tipo").value;

  const categoria = tipo === "Despesa"
    ? document.getElementById("categoriaDespesa").value
    : document.getElementById("categoriaReceita").value;

  const valorInput = document.getElementById("valor").value;

  // validações
  if (!validarValor(valorInput)) {
    alert("Valor inválido. Use formato 0,00");
    return;
  }

  const valorNumerico = parseFloat(valorInput.replace(",", "."));

  if (valorNumerico < 0) {
    alert("Valor não pode ser negativo");
    return;
  }

  const parcelas = parseInt(document.getElementById("parcelas").value);

  if (parcelas < 0) {
    alert("Parcelas não pode ser negativo");
    return;
  }

  const data = {
    token: "Desafio2026",
    data: document.getElementById("data").value,
    tipo: tipo,
    categoria: categoria,
    descricao: document.getElementById("descricao").value,
    parcelas: parcelas,
    valor: valorNumerico
  };

  const res = await fetch(URL_SCRIPT, {
    method: "POST",
    body: JSON.stringify(data)
  });

  const text = await res.text();

  if (text === "OK") {
    alert("Registro salvo");
  } else {
    alert("Erro: " + text);
  }
}

</script>

</body>
</html>
