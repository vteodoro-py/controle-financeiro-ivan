<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Financeiro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  display: flex;
  justify-content: center;
  padding: 30px;
}

.container {
  background: #ffffff;
  width: 420px;
  border-radius: 16px;
  padding: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h2 {
  margin: 0 0 20px;
  text-align: center;
  color: #0f172a;
}

label {
  font-size: 12px;
  color: #555;
  margin-top: 10px;
  display: block;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border-radius: 10px;
  border: 1px solid #ddd;
  outline: none;
  font-size: 14px;
}

input:focus, select:focus {
  border-color: #6366f1;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border: none;
  border-radius: 12px;
  background: #6366f1;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #4f46e5;
}

.card {
  background: #f1f5f9;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 15px;
  text-align: center;
  font-size: 13px;
  color: #334155;
}
</style>
</head>

<body>

<div class="container">

<h2>💰 Controle Financeiro</h2>

<div class="card">
Sistema conectado ao Google Sheets
</div>

<label>Data</label>
<input type="date" id="data">

<label>Tipo</label>
<select id="tipo" onchange="trocarTipo()">
  <option value="">Selecione</option>
  <option value="Despesa">Despesa</option>
  <option value="Receita">Receita</option>
</select>

<label>Categoria (Despesa)</label>
<select id="categoriaDespesa">
  <option>Alimentação</option>
  <option>Transporte</option>
  <option>Moradia</option>
</select>

<label>Categoria (Receita)</label>
<select id="categoriaReceita" style="display:none;">
  <option>Salário</option>
  <option>Freelance</option>
  <option>Investimento</option>
</select>

<label>Descrição</label>
<input type="text" id="descricao">

<label>Parcelas</label>
<input type="number" id="parcelas" value="1">

<label>Valor</label>
<input type="number" id="valor">

<button onclick="salvar()">Salvar lançamento</button>

</div>

<script>

const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbyEjKYND3VbIFUC3w_ApiI2YfCR1_uK6Z4atjDUZL6p-Cw6UabHTuwfM5J4CzQUb-1cZw/exec";

function trocarTipo() {
  const tipo = document.getElementById("tipo").value;

  document.getElementById("categoriaDespesa").style.display =
    tipo === "Despesa" ? "block" : "none";

  document.getElementById("categoriaReceita").style.display =
    tipo === "Receita" ? "block" : "none";
}

async function salvar() {

  const tipo = document.getElementById("tipo").value;

  const categoria = tipo === "Despesa"
    ? document.getElementById("categoriaDespesa").value
    : document.getElementById("categoriaReceita").value;

  const rawDate = document.getElementById("data").value;

  const dataFinal = rawDate
    ? rawDate
    : new Date().toISOString().split("T")[0];

  const data = {
    token: "Desafio2026",
    data: dataFinal,
    tipo: tipo,
    categoria: categoria,
    descricao: document.getElementById("descricao").value,
    parcelas: document.getElementById("parcelas").value || 1,
    valor: document.getElementById("valor").value
  };

  const res = await fetch(URL_SCRIPT, {
    method: "POST",
    body: JSON.stringify(data)
  });

  const text = await res.text();

  if (text === "OK") {
    alert("Lançamento salvo!");
  } else {
    alert("Erro: " + text);
  }
}

</script>

</body>
</html>
